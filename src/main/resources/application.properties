spring.application.name=coworkhub

# ---------------------------------------------------------------- Base de datos (MySQL 8)
# Por defecto apunta al contenedor de Docker publicado en el puerto 3307 (el 3306 suele
# estar ocupado por un MySQL instalado). Se cambia con la variable COWORKHUB_DB_PORT.
# ⚠️ Solo para desarrollo: en un entorno real la contraseña viene de una variable de
# entorno o de un gestor de secretos, nunca del repositorio.
spring.datasource.url=jdbc:mysql://localhost:${COWORKHUB_DB_PORT:3307}/coworkhub
spring.datasource.username=${COWORKHUB_DB_USER:coworkhub}
spring.datasource.password=${COWORKHUB_DB_PASSWORD:coworkhub}

# ---------------------------------------------------------------- JPA
# create = en cada arranque borra las tablas, las vuelve a crear y ejecuta import.sql:
# siempre se empieza con los mismos datos de prueba, sin duplicados.
spring.jpa.hibernate.ddl-auto=create
# Muestra el SQL en consola: sirve para comprobar que los listados no tienen el problema N+1.
spring.jpa.show-sql=true
# Sin "open session in view": todo lo que un DTO necesita se carga dentro del servicio.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- Actuator (RF-15)
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------- JWT (RF-11 y RF-12)
# ⚠️ ADVERTENCIA EDUCATIVA: esta clave está en el repositorio SOLO con fines académicos, para que
# el proyecto arranque sin configurar nada. En un entorno real la clave de firma debe venir de una
# variable de entorno (COWORKHUB_JWT_SECRETO) o de un gestor de secretos, nunca del código ni del
# repositorio: quien la conozca puede fabricar tokens válidos de cualquier usuario. Mínimo 32 caracteres.
coworkhub.jwt.secreto=${COWORKHUB_JWT_SECRETO:clave-educativa-de-coworkhub-solo-para-desarrollo-cambiala-en-produccion}
# Vigencia del token en minutos
coworkhub.jwt.minutos=60

# ---------------------------------------------------------------- Swagger / OpenAPI (RF-13)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.coworkhub
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json

# ---------------------------------------------------------------- Reloj de negocio
# Vacío = hora real. Con un valor (formato yyyy-MM-ddTHH:mm:ss) "ahora" queda congelado
# en ese instante, para repetir los escenarios de RN-03 y RN-08. Ejemplo:
# coworkhub.reloj.fijo=2030-06-03T08:00:00
coworkhub.reloj.fijo=

# Con ddl-auto=create, Hibernate intenta borrar tablas que en el primer arranque todavía no
# existen y lo avisa con mensajes largos pero inofensivos. Se ocultan para no confundir.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
