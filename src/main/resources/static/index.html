<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoWorkHub</title>
    <meta name="description" content="Gestión de sedes, salas, miembros y reservas de una red de coworking.">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Pantalla de inicio de sesión -->
    <main id="pantalla-login" class="login" hidden>
        <section class="login__tarjeta">
            <div class="marca marca--grande">
                <img src="img/logo.svg" alt="" width="40" height="40">
                <span>CoWorkHub</span>
            </div>
            <p class="login__lema">Reservas de salas, miembros y planes de tu red de coworking.</p>

            <form id="form-login" class="formulario" autocomplete="on">
                <label class="campo">
                    <span>Usuario</span>
                    <input name="usuario" required autocomplete="username" autofocus>
                </label>
                <label class="campo">
                    <span>Contraseña</span>
                    <input name="contrasena" type="password" required autocomplete="current-password">
                </label>
                <p class="error-formulario" id="error-login" hidden></p>
                <button class="boton boton--primario boton--ancho" type="submit">Iniciar sesión</button>
            </form>

            <div class="login__demo">
                <p>Usuarios de prueba (datos ficticios de <code>import.sql</code>):</p>
                <div class="chips" id="usuarios-demo"></div>
            </div>
        </section>
    </main>

    <!-- Aplicación -->
    <div id="pantalla-app" class="app" hidden>
        <header class="barra">
            <button class="barra__menu" id="boton-menu" aria-label="Abrir el menú" aria-expanded="false">☰</button>
            <div class="marca">
                <img src="img/logo.svg" alt="" width="28" height="28">
                <span>CoWorkHub</span>
            </div>
            <div class="barra__usuario">
                <a class="enlace-discreto" href="/doc/swagger-ui.html" target="_blank" rel="noopener">API · Swagger</a>
                <span class="usuario" id="usuario-actual"></span>
                <button class="boton boton--fantasma" id="boton-salir">Salir</button>
            </div>
        </header>

        <nav class="menu" id="menu" aria-label="Secciones"></nav>

        <main class="contenido" id="contenido" tabindex="-1"></main>
    </div>

    <!-- Ventana modal reutilizable -->
    <dialog class="modal" id="modal">
        <form method="dialog" class="modal__cabecera">
            <h2 id="modal-titulo"></h2>
            <button class="modal__cerrar" aria-label="Cerrar">×</button>
        </form>
        <div class="modal__cuerpo" id="modal-cuerpo"></div>
        <!-- Avisos mientras la modal está abierta (la modal tapa todo lo que está fuera de ella) -->
        <div class="avisos" id="avisos-modal" role="status" aria-live="polite"></div>
    </dialog>

    <!-- Avisos -->
    <div class="avisos" id="avisos" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
